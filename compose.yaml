name: event-sourcing-wallet-03-cqrs-async

services:
  postgres:
    image: postgres:17.11-bookworm
    # Локальный Linux: прямое подключение без проблем Docker bridge.
    network_mode: host
    command: ["postgres", "-p", "28742", "-c", "listen_addresses=127.0.0.1"]
    environment:
      PGPORT: "28742"
      POSTGRES_DB: wallet
      POSTGRES_USER: ${DB_USERNAME:-wallet}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wallet}
    volumes:
      - wallet_async_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  wallet_async_postgres_data:

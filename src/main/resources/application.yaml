server:
  port: 28741

spring:
  application:
    name: event-sourcing-wallet
  datasource:
    # Значения по умолчанию предназначены только для локального обучения.
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:28742/wallet}
    username: ${DB_USERNAME:wallet}
    password: ${DB_PASSWORD:wallet}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  sql:
    init:
      mode: never

# Обычные консольные логи; для подробной диагностики задайте WALLET_LOG_LEVEL=DEBUG.
logging:
  level:
    com.example.wallet: ${WALLET_LOG_LEVEL:INFO}

wallet:
  projection:
    poll-interval-ms: ${WALLET_PROJECTION_POLL_INTERVAL_MS:3000}
    initial-delay-ms: ${WALLET_PROJECTION_INITIAL_DELAY_MS:1000}
    batch-size: ${WALLET_PROJECTION_BATCH_SIZE:50}

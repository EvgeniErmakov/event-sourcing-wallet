spring:
  application:
    name: event-sourcing-wallet
  datasource:
    # Значения по умолчанию предназначены только для локального обучения.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wallet}
    username: ${DB_USERNAME:wallet}
    password: ${DB_PASSWORD:wallet}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  sql:
    init:
      mode: never

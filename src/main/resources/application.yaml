server:
  port: 28741

spring:
  application:
    name: event-sourcing-wallet
  datasource:
    # Значения по умолчанию предназначены только для локального обучения.
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:28742/wallet}
    username: ${DB_USERNAME:wallet}
    password: ${DB_PASSWORD:wallet}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        globally_quoted_identifiers: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  sql:
    init:
      mode: never

# Обычные консольные логи; для подробной диагностики задайте WALLET_LOG_LEVEL=DEBUG.
logging:
  level:
    com.example.wallet: ${WALLET_LOG_LEVEL:INFO}

axon:
  eventstorage:
    jpa:
      polling-interval: 3000
